id: a980f705-df43-4aa2-b088-b39b9b198253
name: web_favicon
type: check
description: Download favicon and fingerprint framework via MD5 hash comparison
entry: check.py:FaviconCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- favicon_info
intrusive: false
service_types:
- http
- html
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- favicon fingerprinting
- technology identification
references:
- OWASP WSTG-INFO-08
- OWASP Favicon Database
reason: Favicon hashes identify frameworks, admin panels, and AI platforms without
  active probing
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in the
  # response, so no grader above the rule tier is ever called. These are the
  # PRE-grade values a candidate carries (§6.1) — `grade()` places the real one
  # — and `default` is the lowest severity this check emits, so a deferred or
  # failed grade can never over-escalate `on_critical`.
  #
  # Every framework match is a separate judgement over one service, so the probe
  # emits one undiscriminated candidate and `grade()` names each.
  # `favicon-<framework>` carries the framework it matched (`favicon-jenkins`,
  # `favicon-jupyter`); that set follows the hash table, so the map records the
  # `favicon` family and `provisional_for` falls to `default`.
  #
  # Both severities are `info` — this check fingerprints, it does not find a
  # weakness. A hash match carries 0.95: the match itself is exact, but the table
  # holds each project's *default* favicon, so it establishes that the default
  # was left in place rather than which version runs. `no-favicon` carries 0.8,
  # because it is an absence claim over at most three URLs.
  default: info
  observations:
    favicon: info
    no-favicon: info
