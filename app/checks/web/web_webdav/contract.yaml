id: a4ed6e0a-5979-4f9a-9cd1-7dbbfa18849d
name: web_webdav
type: check
description: Probe for WebDAV methods that allow file upload or directory listing
entry: check.py:WebDAVCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- webdav_observations
intrusive: true
service_types:
- http
- html
- api
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- WebDAV method probing
- HTTP method enumeration
references:
- OWASP WSTG-CONF-06
- CWE-284
reason: WebDAV write access = arbitrary file upload = likely RCE path, superseding
  AI-specific observations
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in
  # the response, so no grader above the rule tier
  # is ever called. These are the PRE-grade values a candidate carries
  # (§6.1) — `grade()` places the real one. `default` is the lowest severity
  # this check emits, so a deferred or failed grade can never over-escalate
  # `on_critical`.
  # Three independent judgements over one service, so the probe emits one
  # undiscriminated candidate and `grade()` names each. `default` is
  # `medium` — the lowest of the four — so a deferred grade can never
  # present an ungraded candidate as one of the two criticals.
  default: medium
  observations:
    propfind-enabled: high
    put-write-access: critical
    put-requires-auth: medium
    mkcol-enabled: critical
