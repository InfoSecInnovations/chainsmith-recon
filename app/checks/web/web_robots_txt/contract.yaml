id: 162cb80e-2af0-4038-ae90-e4b2966062e2
name: web_robots_txt
type: check
description: Retrieve robots.txt and identify potentially sensitive paths
entry: check.py:RobotsTxtCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- robots_paths
intrusive: false
service_types:
- http
- html
- api
- ai
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- passive reconnaissance
- path discovery
references:
- OWASP WSTG-INFO-03
- RFC 9309
reason: robots.txt often reveals hidden paths that admins want to keep from search
  engines
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in
  # the response, so no grader above the rule tier
  # is ever called. These are the PRE-grade values a candidate carries
  # (§6.1) — `grade()` places the real one. `default` is the lowest severity
  # this check emits, so a deferred or failed grade can never over-escalate
  # `on_critical`.
  # Both judgements read the same recorded file and can both fire, so the
  # probe emits one undiscriminated candidate and `grade()` names each.
  default: info
  observations:
    sensitive-paths: low
    sitemaps-disclosed: info
