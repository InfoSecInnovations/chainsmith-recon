id: 974e0cab-d4c7-4eef-858a-12ec8bee407a
name: web_redirect_chain
type: check
description: Follow redirect chains and check for HTTP->HTTPS, open redirects, excessive
  hops
entry: check.py:RedirectChainCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- redirect_info
intrusive: true
service_types:
- http
- html
- api
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- redirect chain analysis
- open redirect testing
references:
- OWASP WSTG-CLNT-04
- CWE-601
reason: Missing HTTPS redirects expose traffic to interception; open redirects enable
  phishing
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in the
  # response, so no grader above the rule tier is ever called. These are the
  # PRE-grade values a candidate carries (§6.1) — `grade()` places the real one
  # — and `default` is the lowest severity this check emits, so a deferred or
  # failed grade can never over-escalate `on_critical`.
  #
  # All five judgements read the same recorded hops, so the probe emits one
  # undiscriminated candidate and `grade()` names each. `open-redirect-<path>`
  # carries the endpoint it was found at; that set follows
  # `REDIRECT_PARAM_PATHS`, so the map records the `open-redirect` family and
  # `provisional_for` falls to `default`.
  #
  # Two confidences are load-bearing. `open-redirect` fired whenever the target
  # string appeared *anywhere* in the Location header, which an error page
  # quoting the parameter back also satisfies — so it is 0.97 when the
  # Location's own host is the attacker's and 0.5 when the string merely
  # appears inside it. `cross-domain` subtracts the service host as a string,
  # so `www.example.com` reads as external to `example.com`: 0.9 for a host
  # sharing no registrable domain, 0.6 for a sibling or parent.
  #
  # `https-redirect-ok` is 0.99 (status and Location verbatim);
  # `no-https-redirect` 0.95, since it is one request to one path and a site
  # can upgrade elsewhere or rely on HSTS; `long-chain` 0.95, the hop count
  # being what was actually followed up to the 10-hop cap.
  default: info
  observations:
    https-redirect-ok: info
    no-https-redirect: medium
    long-chain: low
    cross-domain: info
    open-redirect: medium
