id: a8d16d56-ecb2-498e-adc2-4d6d6817df1a
name: web_cors
type: check
description: Test for overly permissive CORS configurations
entry: check.py:CorsCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- cors_observations
intrusive: false
service_types:
- http
- html
- api
- ai
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- configuration testing
- CORS exploitation
references:
- OWASP WSTG-CLNT-07
- CWE-942
- PortSwigger CORS
reason: CORS misconfigurations can allow malicious sites to steal data via a user's
  browser
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in
  # the preflight response, so no grader above the
  # rule tier is ever called. `default` is the pre-grade severity one candidate
  # carries (§6.1) — the lowest this check emits, so a deferred or failed grade
  # can never over-escalate `on_critical`. These are pre-grade values; `grade()`
  # places the real one and may place it higher (wildcard-origin and
  # reflected-origin both reach `high` when credentials are allowed).
  default: medium
  observations:
    wildcard-origin: medium
    reflected-origin: medium
    null-origin: medium
