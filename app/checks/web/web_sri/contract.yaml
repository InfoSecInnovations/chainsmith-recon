id: f188da32-c802-4c75-8921-11a8b3c53a64
name: web_sri
type: check
description: Verify external resources use Subresource Integrity (SRI) hashes
entry: check.py:SRICheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- sri_info
intrusive: false
service_types:
- http
- html
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- SRI verification
- supply chain analysis
references:
- W3C Subresource Integrity
- CWE-353
reason: External scripts without SRI are vulnerable to CDN compromise and supply-chain
  attacks
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in the
  # response, so no grader above the rule tier is ever called. These are the
  # PRE-grade values a candidate carries (§6.1) — `grade()` places the real one
  # — and `default` is the lowest severity this check emits, so a deferred or
  # failed grade can never over-escalate `on_critical`.
  #
  # Every judgement reads the same one or two recorded pages, so the probe emits
  # one undiscriminated candidate and `grade()` names each. `no-sri-<slug>`
  # carries a slug of the resource URL; that set is unbounded, so the map
  # records the `no-sri` family and `provisional_for` falls to `default`.
  #
  # `missing-sri` is 0.85, dropping to 0.65 when any of the resources is a
  # protocol-relative URL — `_is_external()` assumes those are third-party
  # without resolving the host, so a site referencing itself that way inflates
  # the count (and the count is what makes it `medium`). The two
  # nothing-to-report verdicts are absence claims over at most two *static*
  # pages, which is why `all-sri` is 0.7 and `no-external` only 0.6: most
  # current applications load their dependencies from JavaScript, and this check
  # cannot see that.
  default: info
  observations:
    missing-sri: low
    no-sri: low
    all-sri: info
    no-external: info
