id: 77bbce92-82d8-4bec-a8fe-2e3a444e2286
name: web_sitemap
type: check
description: Parse sitemap.xml to discover paths missed by wordlist probing
entry: check.py:SitemapCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- sitemap_paths
intrusive: false
service_types:
- http
- html
- api
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- passive reconnaissance
- path discovery
references:
- OWASP WSTG-INFO-03
reason: Sitemaps reveal full URL structure including internal tools, API versioning,
  and AI/ML endpoints
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in the
  # response, so no grader above the rule tier is ever called. These are the
  # PRE-grade values a candidate carries (§6.1) — `grade()` places the real one
  # — and `default` is the lowest severity this check emits, so a deferred or
  # failed grade can never over-escalate `on_critical`.
  #
  # Three judgements over one set of sitemap bodies, so the probe emits one
  # undiscriminated candidate and `grade()` names each. The sitemap *index*
  # lists no page URLs of its own, so it is not handed to the grader — only the
  # bodies paths were actually read out of.
  #
  # `sitemap-discovered` is 0.99 (URLs read straight out of XML the target
  # published) and drops to 0.9 when the count is a floor rather than a total —
  # a body truncated at the 256 KB capture cap, or the 500-URL ceiling reached.
  # `sensitive-paths` splits hard: 0.9 when a path names a non-production
  # surface (staging/debug/internal/backup, which is also what makes it
  # `medium`), 0.5 otherwise, because the remaining matches are generic
  # `/api/` and `/v1/` patterns that an ordinary public API satisfies.
  # `api-versioning` is 0.85: two `/vN/` prefixes is a direct reading, their
  # being *API* versions is the inference.
  default: info
  observations:
    sitemap-discovered: info
    sensitive-paths: low
    api-versioning: low
