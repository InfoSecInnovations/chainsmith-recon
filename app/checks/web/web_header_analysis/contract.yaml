id: 5ea80cc6-2d9b-4b53-b582-90aa6fb7fe89
name: web_header_analysis
type: check
description: Analyze HTTP headers for technology disclosure and security misconfigurations
entry: check.py:HeaderAnalysisCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- header_observations
intrusive: false
service_types:
- http
- html
- api
- ai
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- banner grabbing
- fingerprinting
- security header analysis
references:
- OWASP WSTG-INFO-02
- CWE-200
- CIS Benchmarks
- OWASP Secure Headers Project
reason: HTTP headers often reveal server software, frameworks, and security misconfigurations
severity:
  model: fixed
  # Every judgement here is categorical — the answer is in the headers, not in a
  # reading of them — so no grader above the rule tier will ever be called.
  # These are the PRE-grade values a candidate carries (§6.1); `grade()` places
  # the real one, and may place it higher (cors-wildcard reaches `high` when
  # credentials are allowed). `default` is what the probe assumes when it emits
  # one candidate for a response it has not parsed yet.
  default: low
  observations:
    missing-security-headers: low
    csp-weak: medium
    hsts-weak: low
    xfo-allow-from: medium
    referrer-policy-weak: low
    permissions-policy-permissive: low
    cors-wildcard: medium
    server-version-disclosure: low
