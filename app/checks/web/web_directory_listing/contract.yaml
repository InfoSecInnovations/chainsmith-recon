id: f3f1cdfe-e854-4b56-8a53-73beaadadf3f
name: web_directory_listing
type: check
description: Check for enabled directory listing (autoindex) on discovered paths
entry: check.py:DirectoryListingCheck
suite: web
depends_on:
- output_name: services
  operator: truthy
produces:
- directory_listing_observations
intrusive: false
service_types:
- http
- html
- api
- ai
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- directory listing detection
- information disclosure
references:
- OWASP WSTG-CONF-04
- CWE-548
reason: Directory listing exposes the full filesystem structure including model files,
  training data, and configs
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 2. Categorical: the answer is in the
  # response, so no grader above the rule tier is ever called. These are the
  # PRE-grade values a candidate carries (§6.1) — `grade()` places the real one
  # — and `default` is the lowest severity this check emits, so a deferred or
  # failed grade can never over-escalate `on_critical`.
  #
  # One candidate per listed path, discriminated by it (`listing-root`,
  # `listing-data`, `listing-static`); that set is unbounded, so the map records
  # the `listing` family and `provisional_for` falls to `default`.
  #
  # `grade()` carries 0.95 where the body shows autoindex page furniture and 0.6
  # where only the `SimpleHTTP` substring matched — any page mentioning Python's
  # http.server satisfies that one. The `high` escalation on visible sensitive
  # files caps at 0.8, because it rests on `href` substring matching that a
  # query string like `?format=.json` also satisfies.
  default: medium
  observations:
    listing: medium
