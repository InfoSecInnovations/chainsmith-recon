id: 9a9e1ca9-fad0-4a25-87bd-e4c53a998877
name: agent_multi_agent_detection
type: check
description: Detect multi-agent system architectures and topology
entry: check.py:AgentMultiAgentDetectionCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- multi_agent_topology
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- multi-agent detection
- topology mapping
- delegation analysis
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
- MITRE ATLAS - AML.T0051 LLM Plugin Compromise
reason: Multi-agent systems introduce trust chain vulnerabilities where one compromised
  agent can influence all downstream agents
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. Migrated to probe/grade in 57.4 wave 4. `default` is the
  # pre-grade severity one candidate carries (§6.1) — the lowest this check
  # emits, so a deferred or failed grade can never over-escalate `on_critical`.
  #
  # One verdict per subject, chosen by priority: a management endpoint beats a
  # delegation-phrase match beats bare agent identifiers. Confidence separates a
  # structured agent listing (0.7) from an architecture keyword only (0.5), and
  # marks delegation phrases as the weakest signal (0.4) — a single agent
  # narrating roles produces the same words.
  default: low
  observations:
    management-endpoint: medium
    delegation-detected: medium
    agent-ids: low
