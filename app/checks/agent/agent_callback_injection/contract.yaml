id: e678d5d7-2c54-4ad0-82f5-0783a2672fd5
name: agent_callback_injection
type: check
description: Test for callback/webhook injection and SSRF via agent
entry: check.py:AgentCallbackInjectionCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- callback_injection_results
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- callback injection
- webhook injection
- SSRF via agent
references:
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
- OWASP Top 10 - A10 Server-Side Request Forgery
reason: Agents that accept callback URLs can be exploited for SSRF and data exfiltration
  to attacker-controlled endpoints
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
