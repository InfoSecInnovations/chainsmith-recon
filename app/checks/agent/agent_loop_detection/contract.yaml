id: aa4de267-75fa-451e-b3e2-659b088f718c
name: agent_loop_detection
type: check
description: Detect agent runaway and infinite loop vulnerabilities
entry: check.py:AgentLoopDetectionCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- loop_detection_results
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- loop triggering
- resource exhaustion
- timeout probing
references:
- OWASP LLM Top 10 - LLM04 Model Denial of Service
- MITRE ATLAS - AML.T0029 Denial of ML Service
reason: Agents without execution time limits can be triggered into infinite loops,
  consuming resources and causing denial of service
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. Migrated to probe/grade in 57.4 wave 4. `default` is the
  # pre-grade severity one candidate carries (§6.1) — the lowest this check
  # emits, so a deferred or failed grade can never over-escalate `on_critical`.
  #
  # No `observations:` map: the discriminator embeds the probe id
  # (`runaway-<id>` high / `loop-<id>`, `no-timeout-<id>` medium), so a map
  # cannot enumerate it — `provisional_for()` falls to `default: medium` and
  # `grade()` places the real severity. The elapsed time is read back off the
  # recorded exchange's `elapsed_ms`, not re-measured, so a re-grade reproduces.
  # Confidence: a timeout/5xx is a strong runaway signal (0.7); 'slow' alone is
  # weak (0.5), and 'no timeout' inferred from one slow reply is weakest (0.35).
  default: medium
