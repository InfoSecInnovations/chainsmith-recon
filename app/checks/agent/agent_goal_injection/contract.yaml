id: e1ef3cc5-0367-482e-b9be-2b0e54aae20b
name: agent_goal_injection
type: check
description: Test agent endpoints for goal hijacking vulnerabilities
entry: check.py:AgentGoalInjectionCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- goal_injection_results
- vulnerable_agents
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- prompt injection
- goal hijacking
- jailbreak testing
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
- MITRE ATLAS - AML.T0054 Prompt Injection
- https://arxiv.org/abs/2302.12173
reason: Goal injection can hijack autonomous agents to perform unauthorized actions,
  exfiltrate data, or bypass safety constraints
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
