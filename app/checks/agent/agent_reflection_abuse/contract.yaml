id: d5054fa2-5161-4bc4-bb7a-8b9274589be5
name: agent_reflection_abuse
type: check
description: Test if agent reflection loops can be manipulated via injection
entry: check.py:AgentReflectionAbuseCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- reflection_abuse_results
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- reflection abuse
- self-critique manipulation
- constraint relaxation
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
- MITRE ATLAS - AML.T0054 Prompt Injection
reason: Self-reflection loops can amplify injection payloads — the agent may relax
  constraints during its self-critique step
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
