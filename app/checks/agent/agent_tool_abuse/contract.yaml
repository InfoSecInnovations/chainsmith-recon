id: 7aa9b6d0-3ce4-465f-9d3b-98ba41452ab4
name: agent_tool_abuse
type: check
description: Test for unintended tool invocation via conversational manipulation
entry: check.py:AgentToolAbuseCheck
suite: agent
depends_on:
- output_name: agent_endpoints
  operator: truthy
produces:
- tool_abuse_results
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- tool abuse
- indirect execution
- SSRF via agent
references:
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
- OWASP LLM Top 10 - LLM01 Prompt Injection
- MITRE ATLAS - AML.T0051 LLM Plugin Compromise
reason: Agents with tool access can be tricked into reading files, executing commands,
  making SSRF requests, or exfiltrating data
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
