id: 529358be-06d4-45ca-9c0f-aa4283198ed8
name: agent_discovery
type: check
description: Detect AI agent orchestration endpoints and identify frameworks
entry: check.py:AgentDiscoveryCheck
suite: agent
depends_on:
- output_name: services
  operator: truthy
- output_name: services_probed
  operator: truthy
produces:
- agent_endpoints
- agent_frameworks
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- endpoint discovery
- framework fingerprinting
- API enumeration
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
- MITRE ATLAS - AML.T0051 LLM Plugin Compromise
reason: Agent endpoints expose autonomous AI systems that can execute multi-step tasks,
  access tools, and maintain state - high-value targets for goal injection and privilege
  escalation
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. Migrated to probe/grade in 57.4 wave 4. `default` is the
  # pre-grade severity one candidate carries (§6.1) — the lowest this check
  # emits, so a deferred or failed grade can never over-escalate `on_critical`.
  #
  # No `observations:` map: the discriminator embeds the path (`agent-<path>`),
  # so `provisional_for()` falls to `default: info` and `grade()` places the
  # real severity — `high` for an unauthenticated execution endpoint, `medium`
  # for an unauthenticated schema/discovery one, `info` when auth is required.
  # Confidence is set by the framework signal's KIND: header 0.9 / error-body
  # class name 0.8 / body substrings 0.55 / shared path only 0.4.
  default: info
