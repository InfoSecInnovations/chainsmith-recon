id: e6c6e959-4725-4966-a89f-8c1822e08382
name: ai_conversation_history_leak
type: check
description: Test if endpoints leak other users' conversation history or shared context
entry: check.py:ConversationHistoryLeakCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- history_leak_results
intrusive: true
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- cross-session leakage
- context extraction
references:
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: Shared context in multi-tenant deployments is a data leakage vulnerability
severity:
  model: contextual
  # Attack-compliance: whether the endpoint LEAKED another session is a judgement
  # the evidence places, so this stays `model: contextual` and is in phase 58's
  # grading scope (§7.2). Migrated to probe/grade in 57.4 wave 3: rule logic runs
  # inside grade() at GradingTier.RULE.
  #
  # Two very different signals. The CANARY path is near-certain (0.9): a unique
  # planted token reappearing in a later request means shared server-side context.
  # The INDICATOR path is soft (0.4): a model can say "another user might ask..."
  # conversationally without any leak, which only the LLM tier can separate.
  default: medium
  range: [info, critical]
