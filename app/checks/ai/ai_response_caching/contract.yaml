id: f5ae3e9d-9fce-4e09-89a3-e46e6b99c65d
name: ai_response_caching
type: check
description: Detect response caching by comparing identical requests for content and
  timing patterns
entry: check.py:ResponseCachingCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- cache_detection_results
intrusive: false
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- caching detection
- response analysis
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
reason: Cached responses may bypass content filters that operate on generation time
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 3. Categorical: identical bodies across
  # identical requests are read off the record, so no grader above the rule tier
  # is ever called. `default` is the pre-grade value a candidate carries (§6.1)
  # and the LOWEST of the ladder, so a deferred grade cannot present an ungraded
  # candidate as the `medium` caching-detected finding.
  #
  # Confidence: caching-detected is 0.75 — byte-identical output even at
  # temperature 2.0 (where a live model diverges) is strong, but the prompt is
  # short and factual ("Paris is the capital of France") and near-deterministic
  # even uncached, so the hot-request divergence carries the claim. cache-headers
  # is 0.75 (a CDN may cache the HTTP envelope without the model layer caching the
  # completion). The two no-cache outcomes are 0.7-0.8.
  default: info
  observations:
    cache-headers: low
    caching-detected: medium
    no-cache: info
