id: f548bc11-9ab6-4f7f-949c-4f07a5225b20
name: ai_content_filter_check
type: check
description: Detect and characterize content filtering systems
entry: check.py:ContentFilterCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- content_filter_info
intrusive: true
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- filter detection
- jailbreak testing
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
reason: Understanding content filters helps identify bypass techniques
severity:
  model: contextual
  # Attack-compliance: whether a filter BLOCKED the attack is a judgement the
  # evidence places, not a fact read off the response, so this stays
  # `model: contextual` and is in phase 58's grading scope (§7.2). Migrated to
  # probe/grade in 57.4 wave 3: the rule logic runs inside grade() at
  # GradingTier.RULE; phase 58 adds the LLM tier behind the same seam. `default`
  # is what on_critical reads before a grader runs; `rubric:`/`signals:` inert
  # until 58.
  #
  # The finding here is the ABSENCE of a filter (no-filter, low) — bounded by
  # three prompts, so its confidence is 0.45 and says the search is small.
  # filter-detected is 0.7 because a refusal-phrase match ("policy", "as an ai")
  # can also be a model answering on-topic about policy.
  default: medium
  range: [info, critical]
