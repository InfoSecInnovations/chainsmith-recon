id: 81eb7dfb-ff3c-4dbc-8ab2-9532e5db97cc
name: ai_tool_discovery
type: check
description: Probe chatbot to discover available tools, functions, and data access
entry: check.py:ToolDiscoveryCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- discovered_tools
- chatbot_capabilities
intrusive: true
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- capability enumeration
- social engineering
- tool discovery
references:
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
reason: Understanding chatbot capabilities reveals attack surface for tool abuse and
  data access
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 3. Categorical: the tool names are read
  # out of recorded answers, so no grader above the rule tier is ever called.
  # `default` is the pre-grade value a candidate carries (§6.1) and the LOWER of
  # the two severities emitted, so a deferred grade cannot present an ungraded
  # candidate as the `high` one.
  #
  # The confidence separates two passes the old code merged into one list and one
  # severity. The snake_case pass is strong: a model that writes
  # `get_account_balance` into prose is naming something, and that shape is not
  # ordinary English (0.85). The twenty-one-word indicator table is weak, because
  # it substring-matches single common words — `search`, `send`, `update`,
  # `create`, `internal` — so "I can search our help articles and send you a
  # link" scores three tools and names none. That matters most because five of
  # those bare words (`admin`, `database`, `internal`, `delete`, `transfer`)
  # escalate this check to `high`: a verdict resting only on them carries 0.3 and
  # says why.
  #
  # One behaviour changed on purpose: the names were collected in a `set` and
  # reported as `list(tools)[:10]`, so which ten an operator saw varied between
  # runs over identical responses. They are sorted now — same names, and a
  # verdict that re-derives identically from the same corpus, which is the whole
  # point of the phase.
  #
  # `tools-discovered` is declared `medium`, not `high`, even though `grade()`
  # emits both: one discriminator here spans two severities (the high-risk word
  # list is what raises it), and a map entry IS the provisional value a candidate
  # carries before grading. Declaring the ceiling would let a deferred or failed
  # grade present an ungraded candidate as a `high`. The floor is the only safe
  # declaration when a discriminator is not single-valued.
  default: medium
  observations:
    tools-discovered: medium
