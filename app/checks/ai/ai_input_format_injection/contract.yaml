id: e9e7131d-f3ce-4668-9836-03c84915443d
name: ai_input_format_injection
type: check
description: Test if formatting markers in user input can override instructions
entry: check.py:InputFormatInjectionCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- input_format_results
intrusive: true
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- input format injection
- delimiter confusion
- chat template injection
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
reason: Models trained on specific chat templates may interpret template markers in
  user input as role boundaries
severity:
  model: contextual
  # Attack-compliance: whether a formatting delimiter was interpreted as a role boundary is a judgement the evidence places, not a fact read off
  # the response, so this stays `model: contextual` and is in phase 58's grading
  # scope (§7.2). Migrated to probe/grade in 57.4 wave 3: the rule logic runs
  # inside grade() at GradingTier.RULE, and phase 58 adds the LLM tier behind the
  # same seam. `default` is what on_critical reads before a grader runs; `range`
  # is the span a grader may place within; `rubric:`/`signals:` stay inert until 58.
  #
  # The rule tier's confidence states its own weakness in each verdict: the
  # bypass/persona/override signals are substring and phrase matches, and several
  # payloads instruct the model to emit the very keyword the detector looks for,
  # so a benign compliance and a genuine failure can look alike. That gap is what
  # phase 58's grader closes.
  default: medium
  range: [info, critical]
