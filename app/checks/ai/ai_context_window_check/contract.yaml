id: 3bb3e003-2e49-4b5e-916d-50cb91d0f389
name: ai_context_window_check
type: check
description: Estimate context window size and token limits
entry: check.py:ContextWindowCheck
suite: ai
depends_on:
- output_name: chat_endpoints
  operator: truthy
produces:
- context_info
intrusive: true
service_types: []
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- context probing
- token estimation
references:
- OWASP LLM Top 10
reason: Context limits affect prompt injection payload sizes and conversation hijacking
severity:
  model: fixed
  # Migrated to probe/grade in 57.4 wave 3. Categorical: how big a payload the
  # endpoint accepted is read off the recorded responses, so no grader above the
  # rule tier is ever called. `default` is the pre-grade value a candidate
  # carries (§6.1) and the only severity this check emits — a context window is
  # a fact about the target, not a flaw.
  #
  # The confidence is where this check's honesty lives, and it is never high.
  # The estimate is four samples on a logarithmic ladder, so the answer is a
  # floor with a wide bracket: `~500+ tokens` after a refusal at 2000 locates
  # the wall somewhere in a 1500-token span. The token counts are character-count
  # approximations, not a tokeniser's output. So: a refusal that names context or
  # tokens is 0.75 (the endpoint told us where its limit is), every payload
  # accepted is 0.6 (the probe ran out of sizes, not the endpoint out of
  # context), an unattributed refusal 0.5, and a dropped connection 0.4 — a
  # timeout, a proxy body cap or a gateway giving up produces that just as
  # readily as a real limit.
  default: info
  observations:
    context-window: info
