id: 398a8b80-ad7c-4eec-b115-b910da8b83f8
name: rag_multimodal_injection
type: check
description: Test injection via PDF metadata, EXIF data, and filenames
entry: check.py:RAGMultimodalInjectionCheck
suite: rag
depends_on:
- output_name: rag_endpoints
  operator: truthy
produces:
- multimodal_injection_results
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- multimodal injection
- PDF metadata injection
- filename injection
references:
- OWASP LLM Top 10 - LLM01 Prompt Injection
reason: Text-based content filters only scan document body text. PDF metadata, image
  EXIF, and filenames are frequently passed to the LLM without filtering
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
