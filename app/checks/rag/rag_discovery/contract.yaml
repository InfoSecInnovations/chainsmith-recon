id: 2e47ce0c-e175-4361-aeb9-ff9dbbb51bac
name: rag_discovery
type: check
description: Detect RAG pipeline endpoints and vector store backends
entry: check.py:RAGDiscoveryCheck
suite: rag
depends_on:
- output_name: services
  operator: truthy
- output_name: services_probed
  operator: truthy
produces:
- rag_endpoints
- vector_stores
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- endpoint discovery
- vector store fingerprinting
- API enumeration
references:
- https://arxiv.org/abs/2402.16893
- OWASP LLM Top 10 - LLM01 Prompt Injection
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: RAG pipelines can be exploited for indirect prompt injection, document exfiltration,
  and corpus poisoning attacks
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`. The per-discriminator `observations:` map
  # lands when this check is split into probe/grade (57.4 wave 2).
  default: info
