id: 68a887ba-39c5-4813-8b6c-1d1e8b8910c2
name: rag_corpus_poisoning
type: check
description: Test for writable document ingestion endpoints (corpus poisoning)
entry: check.py:RAGCorpusPoisoningCheck
suite: rag
depends_on:
- output_name: rag_endpoints
  operator: truthy
produces:
- ingestion_endpoints
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- corpus poisoning
- document ingestion
- persistent injection
references:
- https://arxiv.org/abs/2402.16893
- OWASP LLM Top 10 - LLM01 Prompt Injection
reason: Corpus poisoning is persistent indirect injection — the payload lives in the
  knowledge base and affects every user who retrieves the poisoned document, unlike
  query-time injection which affects one session
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
