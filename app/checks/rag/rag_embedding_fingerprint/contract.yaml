id: 8d5fa7ca-17e0-420a-8709-e895b5564279
name: rag_embedding_fingerprint
type: check
description: Fingerprint the RAG embedding model via dimensionality and metadata
entry: check.py:RAGEmbeddingFingerprintCheck
suite: rag
depends_on:
- output_name: rag_endpoints
  operator: truthy
produces:
- embedding_model
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- embedding fingerprinting
- model identification
- dimensionality analysis
references:
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: Knowing the embedding model enables targeted adversarial embedding attacks
  and helps estimate chunk sizes for boundary exploitation
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`.
  default: info
  observations:
    # A closed two-value set; the check emits exactly one per service.
    embedding-model: low
    embedding-unknown: info
