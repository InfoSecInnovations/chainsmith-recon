id: 3fe82835-dc9b-43af-838d-9d3bb42711b7
name: rag_source_attribution
type: check
description: Analyze RAG source citation reliability and URL validation
entry: check.py:RAGSourceAttributionCheck
suite: rag
depends_on:
- output_name: rag_endpoints
  operator: truthy
produces:
- citation_reliability
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- citation analysis
- source attribution testing
- URL validation
references:
- OWASP LLM Top 10 - LLM09 Overreliance
reason: Spoofed citations can make injected content appear authoritative, and unvalidated
  citation URLs can be used for phishing
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`.
  default: info
  observations:
    # A closed four-value set. The suspicious-URL verdict can accompany either
    # of the two "citations present" verdicts; "no-citations" stands alone.
    citation-urls-suspicious: medium
    citation-structured: low
    citation-unstructured: low
    no-citations: info
