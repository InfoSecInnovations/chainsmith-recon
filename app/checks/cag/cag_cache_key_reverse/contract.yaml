id: 3d526f5b-9764-46b7-bc2e-bd5c02f33be2
name: cag_cache_key_reverse
type: check
description: Map cache key components by systematically varying query inputs
entry: check.py:CacheKeyReverseCheck
suite: cag
depends_on:
- output_name: cag_endpoints
  operator: truthy
produces:
- key_structure
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- cache key analysis
- timing analysis
- input variation
references:
- https://portswigger.net/web-security/web-cache-poisoning
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: 'Understanding cache key structure reveals poisoning vectors: keys that exclude
  system prompts enable multi-tenant attacks'
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`.
  default: low
  observations:
    # A closed five-value set; the check may emit any subset per endpoint, each
    # at the floor below. `grade()` never raises these — the severity a
    # discriminator carries is fixed by which test produced it.
    key-excludes-system-prompt: high
    key-ignores-capitalization: medium
    key-ignores-whitespace: medium
    key-ignores-punctuation: medium
    key-detailed: low
