id: 25292f6f-e23d-47ea-ab23-861d58db9416
name: cag_cache_probe
type: check
description: Probe CAG endpoints for cache leakage and poisoning vulnerabilities
entry: check.py:CAGCacheProbeCheck
suite: cag
depends_on:
- output_name: cag_endpoints
  operator: truthy
produces:
- cache_vulnerabilities
- cache_timing_results
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- cache probing
- timing analysis
- session manipulation
references:
- https://portswigger.net/web-security/web-cache-poisoning
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
- MITRE ATLAS - AML.T0048 Data Poisoning
reason: Cache vulnerabilities can enable cross-user data leakage, context poisoning,
  and side-channel attacks revealing sensitive information
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`.
  default: low
  observations:
    # A closed set: each sub-test emits either a `cache-vuln-<id>` (its category
    # severity) or a `cache-issue-<id>` (always low). `grade()` never raises
    # these — the severity is fixed by the test's category.
    cache-vuln-cross_session_leak: high
    cache-vuln-context_id_enumeration: high
    cache-vuln-cache_key_collision: high
    cache-issue-cross_session_leak: low
    cache-issue-cache_timing: low
    cache-issue-context_id_enumeration: low
    cache-issue-cache_key_collision: low
