id: 29a84f25-f915-4348-ae0d-edfbba6ec415
name: cag_provider_caching
type: check
description: Analyze provider-level prompt caching behavior and token leakage
entry: check.py:ProviderCachingCheck
suite: cag
depends_on:
- output_name: cag_endpoints
  operator: truthy
produces:
- provider_cache_info
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- token analysis
- prompt caching detection
- usage metadata inspection
references:
- https://www.anthropic.com/news/prompt-caching
- https://platform.openai.com/docs/guides/prompt-caching
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: Provider-level prompt caching may reveal shared system prompts and cross-user
  prefix sharing
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`. The discriminator embeds the endpoint
  # path (an unbounded value), so there is no `observations:` map; `grade()`
  # places the real severity (info → low caching → medium shared-prefix).
  default: info
