id: 58f96b79-cbe6-497d-91d1-97a92068a095
name: cag_serialization
type: check
description: Detect unsafe cache serialization formats that enable code execution
entry: check.py:SerializationCheck
suite: cag
depends_on:
- output_name: cag_endpoints
  operator: truthy
produces:
- serialization_risks
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- deserialization detection
- backend probing
- path traversal
references:
- https://portswigger.net/web-security/deserialization
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
- 'CWE-502: Deserialization of Untrusted Data'
reason: Pickle deserialization in cache backends enables arbitrary code execution;
  direct backend access enables cache manipulation
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`. The `serial-format-<path>` discriminator
  # embeds the endpoint path (an unbounded set), so there is no `observations:`
  # map — `grade()` places the severity per test: redis backend
  # info→medium→high→critical (no-auth escalates when redis_cache is already
  # fingerprinted, read from scan context), serialization format
  # medium→high→critical, path traversal high. `info` is the floor.
  default: info
