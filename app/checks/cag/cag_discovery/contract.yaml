id: 2b1a9ea3-9a3c-4063-a747-028e08daabba
name: cag_discovery
type: check
description: Detect Cache-Augmented Generation endpoints and caching infrastructure
entry: check.py:CAGDiscoveryCheck
suite: cag
depends_on:
- output_name: services
  operator: truthy
- output_name: services_probed
  operator: truthy
produces:
- cag_endpoints
- cache_infrastructure
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- cache discovery
- timing analysis
- header fingerprinting
references:
- https://www.anthropic.com/news/prompt-caching
- https://platform.openai.com/docs/guides/prompt-caching
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: CAG systems can be exploited for cache poisoning, stale context attacks, cross-user
  cache leakage, and cache-based denial of service
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`. The `cag-<path>` / `cached-<path>`
  # discriminators embed the path (an unbounded set), so there is no
  # `observations:` map — `grade()` places infra medium/info, endpoint
  # medium/low/info, cached low. `info` is the floor.
  default: info
