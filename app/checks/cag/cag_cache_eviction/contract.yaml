id: 2c591be5-bdcf-49e0-9f66-c9da840d6b24
name: cag_cache_eviction
type: check
description: Test cache management endpoint accessibility and eviction behavior
entry: check.py:CacheEvictionCheck
suite: cag
depends_on:
- output_name: cag_endpoints
  operator: truthy
produces:
- eviction_capability
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- cache eviction
- endpoint probing
- auth bypass testing
references:
- https://portswigger.net/web-security/web-cache-poisoning
- OWASP LLM Top 10 - LLM06 Sensitive Information Disclosure
reason: Accessible cache eviction endpoints enable DoS via cache busting and preparation
  for cache poisoning attacks
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. `default` is the pre-grade severity one candidate carries
  # (§6.1) — the lowest this check emits, so a deferred or failed grade can
  # never over-escalate `on_critical`.
  default: medium
  observations:
    # A closed nine-value set, one per row of the two endpoint tables. Each
    # declares its floor: an auth-required answer (401/403) is `medium` for
    # every endpoint; `grade()` raises an accessible bulk endpoint to
    # `critical` and an accessible key-specific one to `high`.
    eviction-clear: medium
    eviction-flush: medium
    eviction-invalidate: medium
    eviction-delete: medium
    eviction-purge: medium
    eviction-reset: medium
    eviction-key-delete_key: medium
    eviction-key-invalidate_key: medium
    eviction-key-delete_entry: medium
