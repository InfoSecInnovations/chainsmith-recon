id: 46382b48-e11a-456b-9fa6-76ccb07cafdb
name: mcp_schema_leakage
type: check
description: Analyze MCP tool schemas for sensitive information leakage
entry: check.py:ToolSchemaLeakageCheck
suite: mcp
depends_on:
- output_name: mcp_tools
  operator: truthy
produces:
- mcp_schema_leaks
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- schema analysis
- information disclosure
- reconnaissance
references:
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
- CWE-200 Exposure of Sensitive Information
reason: Tool schemas may reveal internal infrastructure details useful for targeted
  attacks
severity:
  model: fixed
  # Categorical: the answer is in the analysed schemas (recorded as a `local`
  # exchange), so no grader above the rule tier is ever called. Every leak
  # discriminator embeds a tool and parameter name
  # (`leak-<tool>-<type>-<param>`), an unbounded set, so there is no
  # `observations:` map (§0.12): `default` is the floor — `info`, the no-leaks
  # answer — and grade() places the real severity (57.4 wave 7).
  default: info
