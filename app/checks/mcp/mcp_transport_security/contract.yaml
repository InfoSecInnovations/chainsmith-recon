id: c5b1938e-af1b-4bb2-b246-b45b61302273
name: mcp_transport_security
type: check
description: Analyze MCP transport layer security (TLS, CORS, SSE auth)
entry: check.py:TransportSecurityCheck
suite: mcp
depends_on:
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_transport_security
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- transport analysis
- CORS testing
- TLS verification
references:
- MCP Specification - Transports - https://spec.modelcontextprotocol.io/specification/basic/transports/
- OWASP - Transport Layer Security
reason: MCP endpoints may transmit tool results and credentials in cleartext or allow
  cross-origin access
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. The discriminators are a closed set, so the full map is
  # declared, each at its single severity (§0.12). `transport-ok` is the probe's
  # cross-server "adequate" summary, emitted directly rather than graded, and is
  # the floor. `default` is the lowest of these (57.4 wave 7).
  default: info
  observations:
    no-tls: high
    cors-wildcard: high
    cors-reflect: high
    no-origin-check: medium
    sse-no-auth: medium
    transport-ok: info
