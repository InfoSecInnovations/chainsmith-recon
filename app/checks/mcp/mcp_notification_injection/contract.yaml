id: e15226d9-b857-4134-9e48-53cef8aa2436
name: mcp_notification_injection
type: check
description: Test if MCP server accepts unsolicited client notifications
entry: check.py:MCPNotificationInjectionCheck
suite: mcp
depends_on:
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_notification_status
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- protocol abuse
- notification injection
- state manipulation
references:
- MCP Specification - Lifecycle - https://spec.modelcontextprotocol.io/specification/basic/lifecycle/
- MCP Specification - Notifications
reason: MCP bidirectional notifications may allow clients to manipulate server state
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
