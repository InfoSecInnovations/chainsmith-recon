id: f2c95429-7bff-4e11-bafa-afe537717381
name: mcp_auth_check
type: check
description: Check MCP server authentication and authorization enforcement
entry: check.py:MCPAuthCheck
suite: mcp
depends_on:
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_auth_status
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- authentication testing
- authorization bypass
- session analysis
references:
- MCP Specification - https://modelcontextprotocol.io/specification
- OWASP LLM Top 10 - LLM07 Insecure Plugin Design
reason: Local dev MCP servers often have no auth. Testing enforcement reveals unauthenticated
  tool access.
severity:
  model: fixed
  # Categorical: the answer is in each test's recorded response, so no grader
  # above the rule tier is ever called. Some discriminators embed a key value
  # (`default-key-<key>`), an unbounded set, so there is no `observations:` map
  # (§0.12): `default` is the floor — `info`, the auth-enforced answer — and
  # grade() places the real severity (57.4 wave 7).
  default: info
