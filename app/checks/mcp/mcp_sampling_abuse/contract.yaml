id: b487d464-3ac6-4bac-ad90-25111c65cc12
name: mcp_sampling_abuse
type: check
description: Test MCP sampling endpoint for open LLM proxy and filter bypass
entry: check.py:MCPSamplingAbuseCheck
suite: mcp
depends_on:
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_sampling_status
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- LLM proxy abuse
- content filter bypass
- system prompt injection
references:
- MCP Specification - Sampling - https://spec.modelcontextprotocol.io/specification/server/sampling/
reason: MCP sampling endpoints expose an LLM proxy that may bypass content filters
severity:
  model: contextual
  # Attack-compliance: severity is a continuum the evidence places, not a fact
  # read off the response, so this check is in phase 58's grading scope (§7.2).
  # `default` is what `on_critical` reads before a grader has run; `rubric:` and
  # `signals:` are inert until 58 and are authored with it.
  default: medium
  range: [info, critical]
