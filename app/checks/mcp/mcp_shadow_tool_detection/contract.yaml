id: 16765a9a-c3c5-48dc-87ab-3f0a6473d7f9
name: mcp_shadow_tool_detection
type: check
description: Detect MCP shadow tool attack susceptibility
entry: check.py:ShadowToolDetectionCheck
suite: mcp
depends_on:
- output_name: mcp_tools
  operator: truthy
produces:
- mcp_shadow_tool_risk
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- namespace analysis
- protocol probing
- collision detection
references:
- MCP Specification - https://modelcontextprotocol.io/specification
- MITRE ATLAS - AML.T0051 LLM Plugin Compromise
reason: In multi-server MCP setups, tool name collisions allow attackers to shadow
  legitimate tools with malicious replacements
severity:
  model: fixed
  # Categorical: namespace/collision analysis reads the enumerated tool names
  # (recorded as a `local` exchange) and the protocol verdicts read recorded
  # POST responses, so no grader above the rule tier is ever called. The
  # discriminators are a closed five-value set, so the map below carries each at
  # the severity it emits; `default` is the floor — `info` (57.4 wave 7).
  default: info
  observations:
    namespace-safe: info
    namespace-flat: medium
    name-collision: low
    list-changed-accepted: high
    reinitialize-accepted: low
