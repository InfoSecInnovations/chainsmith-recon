id: dc47108e-294f-4f1c-9a36-7efe54b94681
name: mcp_protocol_version
type: check
description: Test MCP server for protocol version downgrade vulnerabilities
entry: check.py:MCPProtocolVersionCheck
suite: mcp
depends_on:
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_protocol_versions
intrusive: false
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- protocol downgrade
- version probing
references:
- MCP Specification - https://modelcontextprotocol.io/specification
reason: Older MCP protocol versions may have weaker security or missing capabilities
severity:
  model: fixed
  # Categorical: the answer is in the response, so no grader above the rule tier
  # is ever called. The two discriminators are a closed set, so the full map is
  # declared at each floor (§0.12): `protocol-downgrade` at `low` (it rises to
  # `medium` only when the old version sheds capabilities), `protocol-current` at
  # `info`. `default` is the lowest of these (57.4 wave 7).
  default: info
  observations:
    protocol-downgrade: low
    protocol-current: info
