id: cf579bec-bf32-4e61-9b8d-d588dcd6557a
name: mcp_tool_rate_limit
type: check
description: Test if MCP tool invocations are rate limited
entry: check.py:ToolRateLimitCheck
suite: mcp
depends_on:
- output_name: mcp_tools
  operator: truthy
- output_name: mcp_servers
  operator: truthy
produces:
- mcp_rate_limit_status
intrusive: true
service_types:
- ai
- api
- http
parallel_safe: false
outputs:
  observations:
  - Observation
side_effects:
- network
techniques:
- rate limit testing
- abuse potential assessment
references:
- OWASP API4:2023 Unrestricted Resource Consumption
- MCP Specification - https://modelcontextprotocol.io/specification
reason: Unrestricted tool invocations enable SSRF proxy abuse and resource exhaustion
severity:
  model: fixed
  # Categorical: the answer is the burst's status codes on the recorded
  # responses, so no grader above the rule tier is ever called. Both
  # discriminators embed the tool name (`ratelimit-<tool>` /
  # `no-ratelimit-<tool>`), an unbounded set, so there is no `observations:` map
  # (§0.12): `default` is the floor — `info`, the rate-limited answer — and
  # grade() places the real severity (57.4 wave 7).
  default: info
