# Category-A cleanup renames (Phase 56 §8.7) — ONLY checks already migrated.
# Adding a future rename here causes false diff-registry/scan drift (the
# unmigrated check still emits its old name). Append per sub-phase as they land.
#
# 56.2 web (updated in 56.7): the registry/scan baselines predate 56.2 and carry
# the original `*_check` names. The rename-map is applied SINGLE-PASS (no chaining,
# registry_diff._apply_rename / scan_diff), so these must map the BASELINE name
# DIRECTLY to the current live name — `web_*` after the 56.7 prefix sweep — not to
# the intermediate 56.2 `cors`/`sri`/`webdav`. (No separate `cors: web_cors` entry
# is needed: no baseline carries the bare `cors`/`sri`/`webdav` key.)
cors_check: web_cors
sri_check: web_sri
webdav_check: web_webdav
#
# 56.3 network (migrated): folder renamed ports→port_scan; the registered name was
# already `port_scan` so this is a no-op for diff-registry, but the *scan* baseline
# predates the rename and emits `ports`. After 56.7 the live name is
# `network_port_scan`, so the scan-baseline compare maps ports→network_port_scan
# directly (still a no-op for diff-registry, whose baseline key is `port_scan`,
# handled by the 56.7 `port_scan: network_port_scan` entry below).
ports: network_port_scan
#
# 56.7 mcp (RESTORE `mcp_`): the 56.5 strip is reverted — every MCP check is back
# to its `mcp_*` name. The registry baseline predates 56.5 and ALREADY carries the
# `mcp_*` names, and the live registry now emits `mcp_*` again, so the baseline maps
# to itself (identity) → NO mcp entries are needed. The 56.5 `mcp_*: <bare>` strip
# entries that used to live here are DELETED (with the prefix restored they would
# mis-rename the baseline `mcp_*` down to bare and manufacture drift — single-pass
# apply, the chain-collapse lesson). `dev rename-suite` auto-appended the inverse
# `<bare>: mcp_*` lines; those are harmless no-ops (no baseline carries a bare MCP
# key) but were removed too, so this section nets to nothing.
#
# 56.7 network: add the uniform `network_` suite prefix (§14) to every check.
# Applied to the registry baseline (which carries the bare names) → diff-registry CLEAN.
banner_grab: network_banner_grab
dns_enumeration: network_dns_enumeration
